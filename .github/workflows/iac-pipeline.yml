name: IaC Pipeline

on:
  pull_request:
    branches:
      - main
    paths:
      - 'environments/dev/**'
      - 'environments/prod-west/**'
      - 'modules/**'
  push:
    branches:
      - main
    paths:
      - 'environments/dev/**'
      - 'environments/prod-west/**'
      - 'modules/**'
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_VERSION: 1.15.5
  AWS_REGION: us-east-1

jobs:

  request-approval:
    name: Request Approval
    runs-on: ubuntu-latest
    environment: plan-approval
    steps:
      - name: Approval granted
        run: echo "Approved - proceeding to Terraform plan"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: request-approval
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true

  plan-dev:
    name: Plan DEV
    runs-on: ubuntu-latest
    needs: security-scan
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC Context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"

      - name: Configure AWS Credentials OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post Plan Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/dev/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n... truncated ...'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Terraform Plan - DEV\n```\n' + truncated + '\n```'
            });

  plan-prod-west:
    name: Plan PROD-WEST (plan only)
    runs-on: ubuntu-latest
    needs: security-scan
    defaults:
      run:
        working-directory: environments/prod-west
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan_prod_west
        run: terraform plan -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post Plan Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/prod-west/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n... truncated ...'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Terraform Plan - PROD-WEST (plan only)\n```\n' + truncated + '\n```'
            });

  approve-apply:
    name: Approve Apply
    runs-on: ubuntu-latest
    needs: [plan-dev]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: apply-approval
    steps:
      - name: Apply approved
        run: echo "Apply approved - proceeding to terraform apply"

  apply-dev:
    name: Apply DEV
    runs-on: ubuntu-latest
    needs: approve-apply
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

  drift-detection:
    name: Drift Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS Credentials OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Detect Drift (dev) - fail on drift
        id: detect-drift
        run: |
          set -o pipefail
          terraform plan -detailed-exitcode -no-color | tee plan-drift.txt
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "Drift detected in dev environment" >&2
            cat plan-drift.txt >&2
            exit 2
          elif [ "$rc" -ne 0 ]; then
            echo "Terraform plan failed with exit code $rc" >&2
            cat plan-drift.txt >&2
            exit $rc
          else
            echo "No drift detected"
          fi
      - name: Detect Drift CA-7
        run: terraform plan -detailed-exitcode
