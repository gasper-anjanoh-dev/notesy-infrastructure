# ============================================================
# IaC Pipeline — Notesy Infrastructure
# NIST 800-53 Controls Implemented:
# CM-3  Configuration Change Control     — Approval gates
# AC-6  Least Privilege                  — OIDC, no stored keys
# AU-2  Audit Events                     — Full pipeline logging
# AU-3  Audit Record Content             — Plan posted as PR comment
# RA-5  Vulnerability Scanning           — tfsec before plan
# CA-7  Continuous Monitoring            — Nightly drift detection
# CM-6  Configuration Settings           — Drift detection baseline
# ============================================================

name: IaC Pipeline


      - 'environments/prod-west/**'
  TF_VERSION: 1.15.5
  AWS_REGION: us-east-1

jobs:
      - 'modules/**'
  push:
    branches:
      - main
    paths:
      - 'environments/dev/**'
      - 'environments/prod-west/**'
      - 'modules/**'
  schedule:
    # CA-7: Continuous Monitoring — nightly drift detection
    # Runs terraform plan -detailed-exitcode
    # Notifies team that someone made manual AWS console changes
    - cron: '0 6 * * *'

  # AC-6: Least Privilege — OIDC federation
  # No long-lived AWS credentials stored anywhere
  # GitHub Actions assumes IAM role via OIDC token
  # Token is temporary — expires when job ends
  # AWS_ROLE_ARN is a resource identifier not a secret
permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_VERSION: 1.15.5
  AWS_REGION: us-east-1

jobs:
jobs:

  # CM-3: Configuration Change Control — Gate 1
  # No plan runs without human approval
  # Prevents unauthorized infrastructure changes
  # Creates audit trail of who authorized the change request

  request-approval:
    name: Request Approval
    runs-on: ubuntu-latest
    environment: plan-approval
    steps:
      - name: Approval granted
        run: echo "Approved - proceeding to Terraform plan"

  # RA-5: Vulnerability Scanning
  # tfsec scans Terraform code for misconfigurations
  # Catches security issues BEFORE they reach AWS
  # Examples: open security groups, unencrypted storage,
  # overly permissive IAM policies
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: request-approval
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true

  # AU-3: Audit Record Content — Plan as PR Comment
  # Terraform plan output posted to PR before any apply
  # Reviewer sees exactly what will change in AWS
  # Creates evidence record of intended changes
  plan-dev:
    name: Plan DEV
    runs-on: ubuntu-latest
    needs: security-scan
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC Context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"

      # AC-6: OIDC token exchange — no stored credentials
      # GitHub sends JWT to AWS STS
      # AWS validates token against registered OIDC provider
      # Returns temporary credentials valid for this job only
      - name: Configure AWS Credentials OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      # AU-3: Plan output captured for audit and review
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      # AU-3: Plan posted as PR comment
      # Evidence record before any infrastructure change
      - name: Post Plan Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/dev/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n... truncated ...'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Terraform Plan - DEV\n```\n' + truncated + '\n```'
            });

  # CM-3: Staging is plan-only — NEVER applied
  # Demonstrates multi-environment governance
  # Same modules, different variable values
  # Shows infrastructure is environment-agnostic
  plan-prod-west:
    name: Plan PROD-WEST (plan only)
    runs-on: ubuntu-latest
    needs: security-scan
    defaults:
      run:
        working-directory: environments/prod-west
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AC-6: OIDC token exchange — no stored credentials
      - name: Configure AWS Credentials OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan_prod_west
        run: terraform plan -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post Plan Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/prod-west/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n... truncated ...'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Terraform Plan - PROD-WEST (plan only)\n```\n' + truncated + '\n```'
            });

  # CM-3: Configuration Change Control — Gate 2
  # Second approval required before terraform apply
  # Reviewer has seen the plan output on the PR
  # Segregation of duties — different person can approve
  approve-apply:
    name: Approve Apply
    runs-on: ubuntu-latest
    needs: [plan-dev]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: apply-approval
    steps:
      - name: Apply approved
        run: echo "Apply approved - proceeding to terraform apply"

  # CM-3 + AU-2: Controlled Apply with Audit Trail
  # Only runs on merge to main (not on PRs)
  # Only applies to DEV environment
  # Full GitHub Actions log serves as audit record
  # Who applied, when, what changed, which commit
  apply-dev:
    name: Apply DEV
    runs-on: ubuntu-latest
    needs: approve-apply
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        # CM-3: Apply only runs after two human approvals
        # Full change record maintained in GitHub Actions
        run: terraform apply -auto-approve

  # CA-7 + CM-6: Continuous Monitoring and Baseline
  # Runs nightly at 6am UTC via schedule trigger
  # terraform plan -detailed-exitcode
  # Exit code 0 = no drift, infrastructure matches baseline
  # Exit code 2 = DRIFT DETECTED
  #   Someone made manual changes bypassing the pipeline
  #   Pipeline fails — team gets notified
  #   Investigate via CloudTrail to find who changed what
  # This satisfies CA-7 continuous monitoring requirement
  # for FedRAMP and regulated environments
  drift-detection:
    name: Drift Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # AC-6: OIDC token exchange — no stored credentials
      - name: Configure AWS Credentials OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Detect Drift (dev) - fail on drift
        id: detect-drift
        run: |
          set -o pipefail
          # AU-3: Plan output captured for audit and review
          terraform plan -detailed-exitcode -no-color | tee plan-drift.txt
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "Drift detected in dev environment" >&2
            cat plan-drift.txt >&2
            exit 2
          elif [ "$rc" -ne 0 ]; then
            echo "Terraform plan failed with exit code $rc" >&2
            cat plan-drift.txt >&2
            exit $rc
          else
            echo "No drift detected"
          fi
      - name: Detect Drift CA-7
        run: terraform plan -detailed-exitcode
